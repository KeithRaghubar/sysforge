# Names sysforge no longer has (3.5.0-DEV12). `make check-standards` (group
# `retired_names`) fails on any of them anywhere in the repo, comments and
# completions included, outside the files that describe the change on purpose:
# release notes, ROADMAP, ROADMAP-ABANDONED and this file. An entry's `allow`
# adds the files that must still name it (the migration code that reads the old
# value, the tests that check it is refused).
#
# Only names that cannot mean anything else belong here. A spelling still valid
# on another command (`--force`, `--purge`, `--quiet`) or common in other tools
# (`--list`, `--prune`) is checked per command by tests/test_verb_registry.py
# instead (3.5.0-DEV11).
#
#   name     the exact text, matched as a whole word (`-` counts as a word char)
#   id       the roadmap ID that retired it
#   use      what to write instead
#   allow    extra files (globs) where it may still appear

# --- 3.5.0-F15: one spelling per flag ---------------------------------------

[[retired]]
name = "--no-pkg-logs"
id = "3.5.0-F15"
use = "--no-pkg-log"
allow = [
    "docs/design/08-cli-verb-framework.md",
    "docs/design/12-logging.md",
]

[[retired]]
name = "--no-confirm"
id = "3.5.0-F15"
use = "--yes"

[[retired]]
name = "--non-interactive"
id = "3.5.0-F15"
use = "--no-review-config"

[[retired]]
name = "--auto-pgo"
id = "3.5.0-F15"
use = "--yes"
allow = [
    "docs/design/08-cli-verb-framework.md",
]

[[retired]]
name = "--force-retry"
id = "3.5.0-F15"
use = "--retry-failed"

[[retired]]
name = "--skip-boot-audit"
id = "3.5.0-F15"
use = "--allow-boot-audit-failure"

[[retired]]
name = "--skip-build-space-check"
id = "3.5.0-F15"
use = "--allow-low-build-space"

[[retired]]
name = "--purge-log"
id = "3.5.0-F15"
use = "--truncate-log"

[[retired]]
name = "--compiler"
id = "3.5.0-F15"
use = "run kernel --toolchain"

