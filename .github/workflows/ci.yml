# Suite, lint and check-* gates on a clean Arch container (3.4.0-DEV1).
# Contributor-only, never shipped. Required: a ruleset on main makes this
# `gates` job a required status check and changes arrive by pull request, so a
# red run blocks the merge. The job body is tools/ci.sh; reproduce a red run
# locally with `make ci-local`.
name: ci

on:
  # A branch is checked through its pull request; push runs only for main, so a
  # PR's commit is not tested twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    container: docker.io/library/archlinux:base-devel
    steps:
      # git before checkout: without it actions/checkout falls back to a REST
      # tarball with no .git, and lint-sh, next-id and the standards gates all
      # read the repository.
      - name: Install git
        run: pacman -Syu --noconfirm --needed git

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint, suite and gates
        run: bash tools/ci.sh "$GITHUB_WORKSPACE"

  # The end-to-end tier (3.5.0-DEV21): the same scenarios `make e2e` runs under
  # podman, here directly in the job's fresh container, sharing one system. A
  # `pre-release` prerequisite outside GATES, so listed in the Makefile's
  # CI_JOBS; tests/test_ci_tooling.py holds the two to each other.
  e2e:
    runs-on: ubuntu-latest
    container: docker.io/library/archlinux:base-devel
    steps:
      - name: Install git and make
        run: pacman -Syu --noconfirm --needed git make

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: End-to-end scenarios
        run: make e2e E2E_HERE=1
