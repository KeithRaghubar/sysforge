# =============================================================================
# sysforge.toml — global SysForge settings
#
# System default: /etc/sysforge/sysforge.toml
# Override individual values by creating this file or editing it in place.
# =============================================================================

[ui]
# Colorize output: "auto" colours when writing to a terminal and honours
# NO_COLOR / FORCE_COLOR; "always" forces colour on (e.g. piping into a pager);
# "never" disables it. The --color CLI flag overrides this.
color = "auto"
# editor = "vim"       # Override $EDITOR for sysforge reconfigure

[git]
# Timeout in seconds for git pull --rebase during `sysforge update`.
# Set to 0 to disable the timeout (wait indefinitely).
pull_timeout = 30

# Timeout in seconds for git clone / pkgctl repo clone operations.
# Set to 0 to disable the timeout (wait indefinitely).
clone_timeout = 60

[build]
# Which python interpreter PKGBUILD build() steps should use. A bare `python`
# in a PKGBUILD resolves via PATH, so an active version manager (pyenv / asdf /
# conda) can shadow the system python with one that lacks the package's
# `python-*` makedepends. sysforge pins this interpreter ahead of those shims.
#
#   unset / "system"  → the system python (/usr/bin/python). Default.
#   "3.12"            → /usr/bin/python3.12
#   "/path/to/python" → that absolute path
# The resolved interpreter is logged at DEBUG.
# python = "system"

# [failure_handling]
# Per-scenario behaviour for build-failure auto-repair (DESIGN.md §1242).
# Values: "auto_repair" | "auto_repair_with_warning" | "prompt_user" |
#         "abort" | "warn_and_fallback" | "fallback" | "error".
# Defaults below match what auto_repair.py uses when a key is absent:
# silent fixes for the safe scenarios, explicit user consent for
# checksum_mismatch — silent auto-fix would mask supply-chain compromise,
# DO NOT relax this without an equivalent compensating control.
# vendored_deps_missing = "auto_repair"
# pgp_key_missing       = "auto_repair"
# srcinfo_drift         = "auto_repair_with_warning"
# checksum_mismatch     = "prompt_user"

[safety]
# LLVM source-tree safety pre-flight. Surfaces variant, origin, dirty
# status, divergence, install origin, and resolved build_mode for any
# LLVM-toolchain package in scope before fetch / update / build / converge
# / run toolchain touch it.
#
# llvm_strict_toolchain — when true (default), `sysforge run toolchain`
#   refuses to proceed on a dirty or diverged LLVM tree. Bypass per-run
#   with --allow-dirty-llvm. PGO profdata version mismatches are never
#   bypassable — building against stale profdata silently corrupts the
#   output.
# llvm_preflight — when false, suppress the informational pre-flight
#   table for fetch / update / build / converge. The toolchain stage
#   always runs the pre-flight regardless of this setting (it's a safety
#   gate, not just informational there).
llvm_strict_toolchain = true
llvm_preflight        = true
