# =============================================================================
# sysforge.toml — global SysForge settings
#
# System default: /etc/sysforge/sysforge.toml
# Override individual values by creating this file or editing it in place.
# =============================================================================

[ui]
# Colorize output: "auto" colours when writing to a terminal and honours
# NO_COLOR / FORCE_COLOR; "always" forces colour on (e.g. piping into a pager);
# "never" disables it. The --color CLI flag overrides this.
color = "auto"
# editor = "vim"       # Override $EDITOR for sysforge reconfigure
# merge = "vimdiff"    # Diff/merge tool for `sysforge config merge` (.sfnew
#                      # adoption). Resolution: SYSFORGE_MERGE > this > $DIFFPROG
#                      # > vimdiff. Accepts args, e.g. "nvim -d" or "meld".

[log]
# Default stderr verbosity when no -v/--quiet flag is passed (0–3). The shipped
# default is 0 (errors + primary output only); raise it to opt into a more
# verbose baseline. 0 = errors only, 1 = +warnings, 2 = +info (progress
# narration), 3 = +debug (full config/conf dumps). CLI flags always win:
# --quiet forces 0, -v/-vv/-vvv force 1/2/3. File logs always record every
# level regardless of this setting. Invalid values are clamped/ignored.
# verbosity = 0

[git]
# Timeout in seconds for the per-source git fetch sysforge runs to refresh a
# PKGBUILD checkout during `sysforge update` (a full-history fetch + compare via
# the source-sync scheduler, never `git pull --rebase`). Set to 0 to disable the
# timeout (wait indefinitely). The legacy key `pull_timeout` is still honoured.
fetch_timeout = 30

# Timeout in seconds for git clone / pkgctl repo clone operations.
# Set to 0 to disable the timeout (wait indefinitely).
clone_timeout = 60

[aur]
# Politeness / rate-limit throttling for AUR (and gitlab repo) source fetches,
# applied by the source-sync scheduler. Both have safe defaults; uncomment to
# tune for a slow or rate-limit-sensitive connection.
#
# min_fetch_interval_ms — minimum delay between successive source fetches, in
#   milliseconds. Spaces out RPC/clone/fetch traffic so a large update doesn't
#   hammer the AUR. Default 500.
# min_fetch_interval_ms = 500
#
# rate_limit_abort_s — when the AUR returns 429/503, sysforge honours the
#   Retry-After budget; if the accumulated penalty would exceed this many
#   seconds, it aborts the remaining queue instead of waiting it out. Default 120.
# rate_limit_abort_s = 120

[build]
# Which python interpreter PKGBUILD build() steps should use. A bare `python`
# in a PKGBUILD resolves via PATH, so an active version manager (pyenv / asdf /
# conda) can shadow the system python with one that lacks the package's
# `python-*` makedepends. sysforge pins this interpreter ahead of those shims.
#
#   unset / "system"  → the system python (/usr/bin/python). Default.
#   "3.12"            → /usr/bin/python3.12
#   "/path/to/python" → that absolute path
# The resolved interpreter is logged at DEBUG.
# python = "system"

# repo_track = "stable"        # "stable" | "main" — which line source=repo
                               # checkouts follow. "stable" (default) pins the
                               # checkout to the release tag matching pacman's
                               # sync-DB version, so a source build produces the
                               # same version pacman would install. "main" tracks
                               # the packaging repo's main branch (testing-track:
                               # may build a version newer than the stable repos).

# --- Build CPU/IO throttling ------------------------------------------------
# Keep compilation from saturating the machine so interactive apps stay
# responsive. All four are unset by default (builds run unthrottled, makepkg's
# own MAKEFLAGS applies). Each can also be set per flag-profile in profiles.toml
# (a profile value overrides the global default below for that key).
#
# nice — scheduling niceness 0..19 (higher = nicer / lower priority). Lets the
#   build yield CPU to foreground apps the instant you need it, with no
#   throughput loss when the machine is otherwise idle. No privilege needed.
#   Recommended starting point for "don't disturb my other apps".
# nice = 19
#
# ionice — IO scheduling class: "idle" (only when nothing else wants the disk)
#   or "best-effort". Pairs with nice so a heavy build doesn't stall the UI on
#   disk IO either.
# ionice = "idle"
#
# cpu_quota — hard CPU ceiling as a percentage, where 100% = one core's worth
#   (e.g. "600%" caps the build at six cores on an 8-core box, leaving two
#   free even when the rest of the machine is idle). Enforced via a transient
#   systemd-run --scope cgroup; if the user slice lacks CPU-controller
#   delegation or systemd-run is missing, sysforge warns and falls back to
#   nice/ionice. Unlike nice, this is a firm cap rather than a soft yield.
# cpu_quota = "600%"
#
# jobs — parallel build jobs; rewrites the -j token in the emitted MAKEFLAGS
#   (e.g. jobs = 6 → -j6). Coarser than the above — single-threaded link
#   phases still use a full core and some build systems ignore it — but it
#   directly bounds peak parallelism.
# jobs = 6

# pre_build_snapshot — take an optional btrfs snapshot before builds run.
# Off by default. When on and the root is btrfs: delegates to snapper if a
# config covers "/" (that config's retention governs cleanup), otherwise takes
# a raw read-only `btrfs subvolume snapshot` that sysforge does NOT auto-reap
# (you own its cleanup). No-op on non-btrfs roots and under --dry-run. A
# snapshot failure never blocks the build.
# pre_build_snapshot = false

# [failure_handling]
# Per-scenario behaviour for build-failure auto-repair (DESIGN.md §1242).
# Values: "auto_repair" | "auto_repair_with_warning" | "prompt_user" |
#         "abort" | "warn_and_fallback" | "fallback" | "error".
# Defaults below match what auto_repair.py uses when a key is absent:
# silent fixes for the safe scenarios, explicit user consent for
# checksum_mismatch — silent auto-fix would mask supply-chain compromise,
# DO NOT relax this without an equivalent compensating control.
# vendored_deps_missing = "auto_repair"
# pgp_key_missing       = "auto_repair"
# srcinfo_drift         = "auto_repair_with_warning"
# checksum_mismatch     = "prompt_user"

[safety]
# LLVM source-tree safety pre-flight. Surfaces variant, origin, dirty
# status, divergence, install origin, and resolved build_mode for any
# LLVM-toolchain package in scope before fetch / update / build / converge
# / run toolchain touch it.
#
# llvm_strict_toolchain — when true (default), `sysforge run toolchain`
#   refuses to proceed on a dirty or diverged LLVM tree. Bypass per-run
#   with --allow-dirty-llvm. PGO profdata version mismatches are never
#   bypassable — building against stale profdata silently corrupts the
#   output.
# llvm_preflight — when false, suppress the informational pre-flight
#   table for fetch / update / build / converge. The toolchain stage
#   always runs the pre-flight regardless of this setting (it's a safety
#   gate, not just informational there).
llvm_strict_toolchain = true
llvm_preflight        = true

[mesa]
# Hardware-filter mesa's gallium/vulkan drivers, the meson analogue of LLVM
# target filtering. Mesa's PKGBUILD builds EVERY driver
# (gallium-drivers=all, vulkan-drivers=amd,intel,…,freedreno,panfrost,asahi,…);
# most are ARM-SoC/mobile GPUs that can't run on a desktop. When sysforge
# source-builds mesa, trimming to the detected GPU vendors (+ mandatory
# software fallbacks) is a real build-time win.
#
# OFF by default — unlike LLVM filtering, this is opt-in. With it off, mesa
# builds exactly as upstream ships. Drivers are autodetected from lspci (the
# same gpu_vendors the hardware stage records); the mandatory software
# rasterizers (gallium llvmpipe/softpipe/zink, vulkan swrast/lavapipe) are
# ALWAYS kept regardless of override, so headless/VM/recovery never lose a
# renderer.
#
# filter_drivers — master switch. Set true to enable mesa driver filtering.
# filter_drivers = false
#
# gallium / vulkan — optional explicit override lists. A non-empty list pins
# that axis (still baseline-enforced); absent/empty means "autodetect". Tokens
# must be valid meson driver names (e.g. radeonsi, nouveau, iris for gallium;
# amd, intel, nouveau for vulkan).
# gallium = ["radeonsi"]
# vulkan  = ["amd"]

[pgo]
# Instrumentation PGO is "just a build flag" — `sysforge build <pkg> --pgo=record`
# then `--pgo=use` works on ANY package, not only mesa. But it's rarely worth the
# doubled build plus a manual record/use workload outside a hot, long-lived
# library, so `--pgo` on an un-listed package prints a "not recommended" warning.
# List the pkgbases you've decided are worth it here to silence that warning.
# mesa is always treated as allowed (the original, fully-wired case) whether or
# not it appears below.
allow = ["mesa"]

[update]
# Standing defaults for `sysforge update` drift auto-rebuild. The matching
# CLI flags (--rebuild-on-drift / --rebuild-on-toolchain-drift /
# --rebuild-on-flag-drift) still win when passed.
rebuild_on_drift = false            # umbrella: opts into both axes below
rebuild_on_toolchain_drift = false  # rebuild on toolchain-variant drift only
rebuild_on_flag_drift = false       # rebuild on resolved-flag drift only

[doctor]
# Thresholds for the read-only `sysforge doctor` health axes. Each check reads
# its threshold here, falling back to the documented default when unset.
pkg_cache_warn_gb     = 5.0    # pacman axis: warn when the package cache exceeds this (GB)
mirrorlist_stale_days = 14     # pacman axis: warn when /etc/pacman.d/mirrorlist is older than this
disk_low_gb           = 10.0   # storage axis: warn when build-dir free space is under this (GB)
