# =============================================================================
# toolchain.toml — custom LLVM or GCC toolchain build (stage 5 / sysforge run toolchain)
#
# Everything down to line 28 ("END OF HEADER") is documentation;
# the settings themselves start below it.
#
# This stage is opt-in. Building a custom toolchain is a deliberate choice;
# most users should leave this disabled and rely on the system compiler.
# Set enabled = true and configure the fields below to build and install a
# custom compiler before the packages and kernel stages run.
#
# When `compiler` is unset, sysforge defaults to "gcc" — the toolchain
# stage is **register-only** for GCC: it writes the system /usr/bin/gcc
# paths into pipeline state and returns. Stock gcc-libs from pacman's
# base-devel provides the runtime; sysforge never builds GCC from source.
#
# The compiler this stage registers carries over: the packages and kernel
# stages of the same pipeline build with it (kernel.toml `compiler` can
# override), and profiles.toml's [defaults] toolchain is rewritten to match,
# so later `sysforge build` / `update` runs use it too.
#
# COMMENT CONVENTION — two kinds of `#` lines appear below:
#   # text          prose. Explanation only; nothing to uncomment.
#   #key = value    a real setting, shown at its default or with an example
#                   value. Delete the single leading `#` to activate it.
# Section headers are never commented out, even where every key under one
# is, so activating a setting is a one-line edit.
# ============================== END OF HEADER ================================

enabled = false

# How `sysforge update` fingerprints the active toolchain to detect a
# *same-variant* rebuild — a toolchain rebuilt with fresh PGO codegen but the
# same variant name and the same libLLVM soname. (A variant-name change or a
# soname bump is already caught elsewhere; this covers the ABI-compatible,
# different-codegen case only.) Advisory by default — a flagged package is
# listed under `--explain-drift` and rebuilt only with
# `--rebuild-on-toolchain-drift` / `--rebuild-on-drift`.
#   "fingerprint"  (default) — clang path + size + nanosecond mtime + version
#                  line. Fast, no hashing. TRADEOFF: mtime is included, so a
#                  pacman reinstall of a byte-identical clang flips the
#                  fingerprint → one spurious advisory (and, under a rebuild
#                  flag, one spurious rebuild). Fail-safe: rebuilding is always
#                  safe, so this is accepted rather than engineered around.
#   "content_hash" — sha256 of the resolved libLLVM.so (the real codegen
#                  carrier) + the version line. Precise: catches a same-version
#                  libLLVM PGO rebuild the stat method would miss. PERFORMANCE:
#                  hashes a ~100 MB+ shared object on every drift check.
drift_detect = "fingerprint"

# compiler — "gcc" (default when unset) or "llvm". LLVM enables the 4-pass
#   PGO bootstrap, but is fragile across LLVM major bumps — leave on "gcc"
#   unless you specifically want PGO LLVM.
#compiler = "gcc"

# pgo — LLVM only: enable 4-pass PGO bootstrap (ignored for gcc)
#pgo     = true

# skip_build — default false. true registers the existing system compiler
#   into pipeline state without building anything (useful to re-propagate
#   CC/CXX to later stages).
#skip_build = false

# Staging dirs where each pass's binaries are extracted for use as CC/CXX by
# the next pass (kept off the live /usr). Each must be on the same filesystem
# as /usr with ~2 GB free. Defaults shown; override only to relocate them.
#
# pgo_staging1 — pass-1 (bootstrap) staging
#pgo_staging1 = "/var/tmp/sysforge-llvm-stage1"
#
# pgo_staging — pass-3 (instrumented) staging
#pgo_staging  = "/var/tmp/sysforge-llvm-stage2"
#
# pgo_staging3 — pass-4 (optimized) staging
#pgo_staging3 = "/var/tmp/sysforge-llvm-stage3"

# pgo_store — path where profraw files are written during pass 3 and merged
#   to profdata. Profraw files are deleted after merging; profdata is
#   preserved for reuse. On subsequent runs, compatible profdata (same LLVM
#   major) skips passes 1-3. Use --rebuild-profdata to force a full 4-pass
#   build. Needs ~500 MB free during pass 3.
#pgo_store = "/var/cache/sysforge/llvm-pgo"
#
# profile_store — root directory of the other profile stores: build --pgo's
#   pgo/<pkgbase>, the kernel's autofdo/ and propeller/, and bolt/. When unset,
#   SYSFORGE_PROFILE_STORE is used if set, else the default shown.
#profile_store = "/var/cache/sysforge"

# ---------------------------------------------------------------------------
# Build-safety gates (LLVM path only — the GCC path is register-only and skips
# all gates). Gate 1 runs cheap pre-build checks and hard-aborts before any
# build time is spent on a condition that will definitely fail or break the
# live toolchain.
# ---------------------------------------------------------------------------

# min_build_free_gb — minimum free space (GiB) required on each filesystem
#   hosting the staging dirs / pgo_store / build output. A full 4-pass LLVM
#   build needs substantial scratch space; falling short mid-build leaves a
#   half-built tree. Override a trip with --allow-low-build-space.
#min_build_free_gb = 40

# require_multilib — require the [multilib] repo to be enabled in
#   /etc/pacman.conf when any lib32-* package is in the build scope (lib32
#   builds need lib32-glibc etc. from multilib). Set false to skip this check
#   (e.g. a pure-64-bit config that lists no lib32 packages — the check is
#   already a no-op then).
#require_multilib = true

# rebuild_soname_consumers — what to do when the built libLLVM changes its
#   soname (an LLVM version bump, e.g. libLLVM.so.22.1 → libLLVM.so.23.0) and
#   would break installed consumers that link the old soname (mesa's
#   radeonsi/radv/llvmpipe drivers, and others). A same-version PGO rebuild
#   never changes the soname, so this only fires on a version bump. Modes
#   (CLI --rebuild-soname-consumers overrides this key):
#     "prompt" (default) — pre-build, warn + list consumers + ask before
#                          building; approving rebuilds them after install,
#                          declining aborts. Non-interactive runs abort (no
#                          silent breakage).
#     "auto"             — approve without prompting and rebuild consumers
#                          after the toolchain install (use for unattended
#                          runs).
#     "off"              — build the new toolchain but leave consumers for
#                          you to rebuild manually (`sysforge build <pkgs>`).
#rebuild_soname_consumers = "prompt"

# reuse_unchanged — opt-in input-fingerprint reuse for the multi-package PGO
#   build (Pass 4 only). When true (or with --reuse-built), a Pass-4 package
#   whose inputs are unchanged — PKGBUILD content, source commit, profdata,
#   resolved flags, compiler identity, and installed build-dep versions — and
#   whose built artifact is still on disk is NOT rebuilt; the cached artifact
#   is reused. This lets a rerun after a late package failure (e.g.
#   spirv-llvm-translator) skip re-optimizing the identical llvm/llvm-libs.
#   Any input change, config edit, or missing artifact forces a rebuild — it
#   never reuses a stale build. Off by default (a fresh 4-pass build always
#   rebuilds everything; --rebuild-profdata also bypasses the cache).
#reuse_unchanged = false

# ---------------------------------------------------------------------------
# BOLT post-link optimization (LLVM/PGO path only) — EXPERIMENTAL
#
# After the PGO passes build the optimized LLVM, BOLT (Binary Optimization and
# Layout Tool) rewrites clang's library from a profile of it compiling code: the
# PGO→BOLT "fast clang" stack. It runs inside the llvm build, right after the
# optimized build and before anything is installed: sysforge instruments
# libclang-cpp (and libLLVM with `libllvm`), compiles a sample of LLVM's own
# sources with it, rewrites the libraries, checks the result still compiles,
# and repackages. It uses the BOLT tools built in the same tree, so it needs the
# repos' single `llvm` package, and it profiles by instrumentation, so it does
# not need `perf` or any CPU feature. Every step is best-effort: a failure warns
# and the PGO toolchain installs without BOLT. Off by default; not yet run
# through a full toolchain build.
#
[bolt]
# enabled — opt-in; BOLT libclang-cpp inside the llvm build
enabled = false

# libllvm — also BOLT libLLVM.so. Every program that uses LLVM loads it
#   (mesa, lldb, …), so it is the riskier half: leave off unless you want it.
#   libclang-cpp is BOLTed whenever BOLT is on.
#libllvm = false

# training_workload — path to a .cpp the instrumented clang compiles to collect
#   the profile; empty = a sample of LLVM's own compile commands from the build
#   (clang's front-end sources first).
#training_workload = ""
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# `sysforge bench toolchain`: stock repo clang vs the installed build
#
[bench]
# corpus — files or directories of .c/.cc/.cpp/.cxx sources compiled as the
#   timed workload. Empty (default) uses the bench's built-in synthetic TUs,
#   which are not a PGO or BOLT training input. Point this at code the profile
#   was not trained on for a held-out measurement. Each file is compiled on
#   its own with only -O2 -c (-std=c++17 for C++), no include paths or
#   defines, so use standalone or preprocessed (clang -E) sources.
#corpus = ["~/bench-sources"]

# after_build — run `sysforge bench toolchain` automatically once `run
#   toolchain` has installed and verified a toolchain it built from source.
#   Off (default): the stage only prints a one-line hint to run it yourself.
#   Opt-in because right after a long build the machine is at its noisiest,
#   and the bench may download the stock packages. A bench that cannot run
#   is reported and never fails the toolchain stage.
#after_build = false
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Package lists — override built-in defaults if needed
#
# A name is built with the PKGBUILD that builds it, not by its own name: the
# repos now build clang, lld, polly, compiler-rt and openmp (and lldb, libclc,
# …) from the one llvm PKGBUILD, so those names go through the PGO passes with
# llvm, and only separate packages such as spirv-llvm-translator build in the
# non-PGO slots. Installing replaces the packages listed here plus every
# member of those PKGBUILDs that is already installed (e.g. lldb); members you
# never installed are built but left out.
#
# The [packages] section only applies to compiler = "llvm" (the GCC path is
# register-only — no build, no package list).
#
[packages]
#pgo     = ["llvm", "llvm-libs"]
#non_pgo = ["clang", "lld", "polly", "compiler-rt", "openmp", "spirv-llvm-translator"]
#lib32   = ["lib32-llvm", "lib32-llvm-libs", "lib32-clang", "lib32-spirv-llvm-translator"]

# training_corpus — extra packages compiled by the instrumented stage1 clang
#   during Pass 3 to enrich clang.profdata. "llvm" is the implicit base (the
#   self-build always trains on LLVM); adding "mesa" broadens the corpus
#   toward graphics/C-heavy codegen the LLVM self-compilation under-exercises,
#   so the resulting clang is faster at compiling that style of code. Corpus
#   members are NEVER installed and never become -fprofile-use targets — the
#   profile stays clang-keyed. Built with --nodeps, so each extra's
#   makedepends must already be installed; a corpus build failure is
#   non-fatal (the run continues with LLVM-only data). Default ["llvm"]
#   (self-build only). LLVM/PGO path only.
#training_corpus = ["llvm", "mesa"]
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# LLVM_TARGETS_TO_BUILD filtering
#
# When sysforge builds an LLVM PKGBUILD (llvm, clang, compiler-rt, lld, …),
# sysforge injects -DLLVM_TARGETS_TO_BUILD="<list>" into the cmake
# invocation so the built toolchain only carries the backends this host
# actually uses.
#
# Resolution order (first match wins):
#   1. [llvm] targets   in this file — explicit override
#   2. hardware_profile.toml [hardware] llvm_targets — autodetected from
#      host arch (uname -m) + gpu_vendors (lspci)
#   3. Section absent and no autodetection → no filtering, build all
#      targets (the upstream default).
#
# Setting `targets = []` here disables filtering entirely (force build all).
#
# Whatever the source, sysforge adds back any backend an installed package
# needs: AMDGPU always (mesa), plus every backend an installed libLLVM consumer
# imports. Programs that initialize all LLVM targets (lldb, bpftool, OpenCL,
# faust) need every backend, so with one of those installed the filter keeps
# all targets; the build log names the packages responsible.
#
[llvm]
#targets = ["X86", "AMDGPU", "NVPTX"]
# ---------------------------------------------------------------------------
