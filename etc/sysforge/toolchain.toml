# =============================================================================
# toolchain.toml — custom LLVM or GCC toolchain build (stage 6 / sysforge run toolchain)
#
# This stage is opt-in. Building a custom toolchain is a deliberate choice;
# most users should leave this disabled and rely on the system compiler.
# Set enabled = true and configure the fields below to build and install a
# custom compiler before the packages and kernel stages run.
#
# When `compiler` is unset, sysforge defaults to "gcc" — the toolchain
# stage is **register-only** for GCC: it writes the system /usr/bin/gcc
# paths into pipeline state and returns. Stock gcc-libs from pacman's
# base-devel provides the runtime; sysforge never builds GCC from source.
#
# "llvm" is opt-in only and enables the 4-pass PGO bootstrap, which is
# fragile across LLVM major bumps. Leave on "gcc" unless you specifically
# want PGO LLVM.
#
# The built compiler is automatically propagated to subsequent stages via
# pipeline state: packages and kernel will use CC/CXX from this result.
# =============================================================================

enabled = false

# compiler = "gcc"     # "gcc" (default when unset) or "llvm". LLVM enables
#                      # the 4-pass PGO bootstrap, but is fragile across LLVM
#                      # major bumps — leave on "gcc" unless you specifically
#                      # want PGO LLVM.
# pgo     = true       # LLVM only: enable 4-pass PGO bootstrap (ignored for gcc)
# skip_build = false   # default false. true registers the existing system
#                      # compiler into pipeline state without building anything
#                      # (useful to re-propagate CC/CXX to later stages).

# Staging dirs where each pass's binaries are extracted for use as CC/CXX by
# the next pass (kept off the live /usr). Each must be on the same filesystem
# as /usr with ~2 GB free. Defaults shown; override only to relocate them.
# pgo_staging1 = "/var/tmp/sysforge-llvm-stage1"   # pass-1 (bootstrap) staging
# pgo_staging  = "/var/tmp/sysforge-llvm-stage2"   # pass-2 (instrumented) staging
# pgo_staging3 = "/var/tmp/sysforge-llvm-stage3"   # pass-3 (optimized) staging

# Path where profraw files are written during pass 2 and merged to profdata.
# Profraw files are deleted after merging; profdata is preserved for reuse.
# On subsequent runs, compatible profdata (same LLVM major) skips passes 1a-2.
# Use --rebuild-profdata to force a full 4-pass build.
# Needs ~500 MB free during pass 2.
# pgo_store = "/var/cache/sysforge/llvm-pgo"

# ---------------------------------------------------------------------------
# Build-safety gates (LLVM path only — the GCC path is register-only and skips
# all gates). Gate 1 runs cheap pre-build checks and hard-aborts before any
# build time is spent on a condition that will definitely fail or break the
# live toolchain. See DESIGN.md §Toolchain stage boot-safety.
# ---------------------------------------------------------------------------

# Minimum free space (GiB) required on each filesystem hosting the staging
# dirs / pgo_store / build output. A full 4-pass LLVM build needs substantial
# scratch space; falling short mid-build leaves a half-built tree. Override a
# trip with --skip-build-space-check.
# min_build_free_gb = 40

# Require the [multilib] repo to be enabled in /etc/pacman.conf when any
# lib32-* package is in the build scope (lib32 builds need lib32-glibc etc.
# from multilib). Set false to skip this check (e.g. a pure-64-bit config that
# lists no lib32 packages — the check is already a no-op then).
# require_multilib = true

# What to do when the built libLLVM changes its soname (an LLVM version bump,
# e.g. libLLVM.so.22.1 → libLLVM.so.23.0) and would break installed consumers
# that link the old soname (mesa's radeonsi/radv/llvmpipe drivers, and others).
# A same-version PGO rebuild never changes the soname, so this only fires on a
# version bump. Modes (CLI --rebuild-soname-consumers overrides this key):
#   "prompt" (default) — pre-build, warn + list consumers + ask before building;
#                        approving rebuilds them after install, declining aborts.
#                        Non-interactive runs abort (no silent breakage).
#   "auto"             — approve without prompting and rebuild consumers after
#                        the toolchain install (use for unattended runs).
#   "off"              — build the new toolchain but leave consumers for you to
#                        rebuild manually (`sysforge build <pkgs>`).
# rebuild_soname_consumers = "prompt"

# Opt-in input-fingerprint reuse for the multi-package PGO build (Pass 3 only).
# When true (or with --reuse-built), a Pass-3 package whose inputs are unchanged
# — PKGBUILD content, source commit, profdata, resolved flags, compiler identity,
# and installed build-dep versions — and whose built artifact is still on disk is
# NOT rebuilt; the cached artifact is reused. This lets a rerun after a late
# package failure (e.g. spirv-llvm-translator) skip re-optimizing the identical
# llvm/llvm-libs. Any input change, config edit, or missing artifact forces a
# rebuild — it never reuses a stale build. Off by default (a fresh 4-pass build
# always rebuilds everything; --rebuild-profdata also bypasses the cache).
# reuse_unchanged = false

# ---------------------------------------------------------------------------
# Package lists — override built-in defaults if needed
#
# [packages]
# pgo     = ["llvm", "llvm-libs"]
# non_pgo = ["clang", "lld", "polly", "compiler-rt", "openmp", "spirv-llvm-translator"]
# lib32   = ["lib32-llvm", "lib32-llvm-libs", "lib32-clang", "lib32-spirv-llvm-translator"]
#
# The [packages] section only applies to compiler = "llvm" (the GCC path is
# register-only — no build, no package list).
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# LLVM_TARGETS_TO_BUILD filtering
#
# When sysforge builds an LLVM PKGBUILD (llvm, clang, compiler-rt, lld, …),
# pkgbuild_patcher injects -DLLVM_TARGETS_TO_BUILD="<list>" into the cmake
# invocation so the built toolchain only carries the backends this host
# actually uses.
#
# Resolution order (first match wins):
#   1. [llvm] targets   in this file — explicit override
#   2. hardware_profile.toml [hardware] llvm_targets — autodetected from
#      host arch (uname -m) + gpu_vendors (lspci)
#   3. Section absent and no autodetection → no filtering, build all
#      targets (the upstream default).
#
# Setting `targets = []` here disables filtering entirely (force build all).
#
# [llvm]
# targets = ["X86", "AMDGPU", "NVPTX"]
# ---------------------------------------------------------------------------
