# =============================================================================
# packages.toml — SysForge package manifest
#
# Dual role (see DESIGN.md §Package Manifest):
#   - Pipeline `run packages` (bootstrap): every entry is installed.
#   - `sysforge update` / `sysforge build` (steady-state): entries are
#     build-rule overrides applied to the live install set.
#
# Manage with: sysforge packages add / remove / list
#
# Fields per entry (all optional except name):
#   name           required  package name
#   source         optional  "repo" (pacman -S) | "aur" (AUR build) — set when
#                            classification is ambiguous or you want to force routing
#   pkgbuild_patch optional  true = extract and patch PKGBUILD flags before build
#   cache          optional  false = disable ccache/sccache (required for PGO)
#
# An entry with only `name` set has no override effect at steady-state;
# `sysforge packages add` rejects such calls.
#
# AUR packages are resolved via the PKGBUILD directory set in flag_profiles.toml
# ([paths] pkgbuild_src_dir) or [build] pkgbuild_src_dir below; missing clones
# are auto-fetched. Repo packages are installed via pacman -S --needed (no
# build step) unless repo_mode = "profiled" is set or pkgbuild_patch = true.
# =============================================================================

# [build]
# pkgbuild_src_dir = "~/src"   # override the path from flag_profiles.toml for this manifest
# repo_mode    = "pacman"  # "pacman" (default) | "profiled" — how repo-source packages are built
#                          # "pacman"   → install via pacman -S --needed (no build step)
#                          # "profiled" → build from PKGBUILD with sysforge flag profiles
#                          # per-package pkgbuild_patch = true overrides to "profiled" regardless
# update_repo_profiled = false  # true → `sysforge update` walks every installed repo package
#                               # alongside foreign packages, checking the Arch packaging repo
#                               # for newer PKGBUILDs and rebuilding from source. Costs one
#                               # `git fetch` per repo package per run. Independent of
#                               # repo_mode (which only affects the packages stage).


# =============================================================================
# SysForge recommended dependencies
#
# ccache/sccache are used automatically when configured in flag_profiles.toml
# [cache] section (auto-detect by default). reflector is used by the configure
# stage to set up /etc/pacman.d/mirrorlist.
# =============================================================================

# [[package]]
# name = "sysforge-git"
# source = "aur"

[[package]]
name = "ccache"
source = "repo"

[[package]]
name = "sccache"
source = "repo"

[[package]]
name = "reflector"
source = "repo"


