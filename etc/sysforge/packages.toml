# =============================================================================
# packages.toml — SysForge package manifest
#
# Lists every package SysForge should build and install. Run stages consume
# this file; sysforge packages add/remove/sync manage it.
#
# Fields per entry:
#   name           required  package name
#   source         required  "repo" (pacman -S) | "aur" (AUR build)
#   pkgbuild_patch optional  true = extract and patch PKGBUILD flags before build
#   cache          optional  false = disable ccache/sccache for this package
#
# AUR packages are resolved via the PKGBUILD directory set in flag_profiles.toml
# ([paths] pkgbuild_dir). Missing AUR packages are auto-cloned from the AUR.
# Repo packages are installed via pacman -S --needed (no build step).
# =============================================================================

# [build]
# pkgbuild_dir = "~/src"   # override the path from flag_profiles.toml for this manifest
# repo_mode    = "pacman"  # "pacman" (default) | "profiled" — how repo-source packages are built
#                          # "pacman"   → install via pacman -S --needed (no build step)
#                          # "profiled" → build from PKGBUILD with sysforge flag profiles
#                          # per-package pkgbuild_patch = true overrides to "profiled" regardless

# =============================================================================
# Add your packages below
# =============================================================================

# Example repo package:
# [[package]]
# name   = "htop"
# source = "repo"

# Example AUR package:
# [[package]]
# name   = "neovim-git"
# source = "aur"

# Example AUR package with PKGBUILD flag patching:
# [[package]]
# name           = "mesa-git"
# source         = "aur"
# pkgbuild_patch = true

# Example AUR package with cache disabled (e.g. PGO builds):
# [[package]]
# name   = "llvm"
# source = "aur"
# cache  = false
