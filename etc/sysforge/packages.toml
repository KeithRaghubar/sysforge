# =============================================================================
# packages.toml — SysForge package manifest
#
# Everything down to line 51 ("END OF HEADER") is documentation;
# the settings themselves start below it.
#
# Roles (see DESIGN.md §Package Manifest):
#   - Pipeline `run packages` (bootstrap): every entry is installed.
#   - `sysforge update` / `sysforge build` (steady-state): entries are
#     build-rule OVERRIDES applied to the live install set.
#
# This file is NOT the steady-state tracking authority — build_state.toml is.
# Anything sysforge has source-built is maintained (rebuilt from source) by
# `sysforge update` automatically: `sysforge build mesa` keeps mesa current
# with no entry here. `sysforge state forget <pkg>` stops maintaining one.
# packages.toml only declares the bootstrap set + per-package build overrides.
#
# Manage with: sysforge packages add / remove / list
#
# Fields per entry (all optional except name):
#   name           required  package name
#   source         optional  "repo" (pacman -S) | "aur"/"git"/"local" — a routing
#                            HINT for how to obtain the package; set when
#                            classification is ambiguous. Does NOT by itself put
#                            the package under tracking (building it does).
#   enable_build_from_source
#                  optional  true = build this repo package from source
#                            instead of installing the binary via pacman
#   cache          optional  false = disable ccache/sccache (required for PGO)
#
# An entry with only `name` (or only `name` + `source`) has no override
# effect at steady-state. `sysforge packages add` rejects such calls, and
# `sysforge update` warns once and treats the entry as inert (the package is
# still maintained if sysforge built it — that comes from build_state).
#
# AUR packages are resolved via the PKGBUILD directory set in profiles.toml
# ([paths] pkgbuild_src_dir) or [build] pkgbuild_src_dir below; missing clones
# are auto-fetched. Repo packages are installed via pacman -S --needed (no
# build step) unless repo_mode = "build_from_source" is set or
# enable_build_from_source = true.
#
# COMMENT CONVENTION — two kinds of `#` lines appear below:
#   # text          prose. Explanation only; nothing to uncomment.
#   #key = value    a real setting, shown at its default or with an example
#                   value. Delete the single leading `#` to activate it.
# Section headers are always live — only their keys are commented out, so
# activating a setting is a one-line edit. The example blocks at the
# bottom ([group.cosmic], [[package]]) are the exception: each declares a named
# entity rather than a settings table, so uncomment a whole block or none of it
# — the header alone is an incomplete entry.
# ============================== END OF HEADER ================================

[build]
# pkgbuild_src_dir — override the path from profiles.toml for this manifest
#pkgbuild_src_dir = "~/src"
#
# repo_mode — "pacman" (default) | "build_from_source" — bootstrap mode for
#   repo packages, and a steady-state bulk-drift switch:
#     "pacman"           → bootstrap installs repo packages via pacman -S
#                --needed (no build step). At steady-state `sysforge update`
#                only walks repo packages it has already source-built
#                (build_state) or that carry a behavior-changing override.
#     "build_from_source"→ bootstrap builds repo packages from source with
#                your flag profile, AND `sysforge update` walks EVERY
#                installed repo package to surface drift. Of those, the
#                overridden / already-source-built subset is rebuilt from
#                source; the rest take a fast path — one batched
#                `checkupdates` call detects pending upgrades, then one
#                terminal `sudo pacman -Syu` after the source builds. Source
#                artifacts install first so the `IgnoreGroup = sf-build`
#                line from `sysforge setup` protects them.
#   NOTE: you do NOT need "build_from_source" to keep a specific repo
#         package source-built — just `sysforge build <pkg>` once;
#         build_state then keeps it maintained. "build_from_source" is
#         for tracking ALL of them.
#   per-package enable_build_from_source = true overrides regardless
#   Requires `pacman-contrib` for the checkupdates fast path; without it,
#   pacman-class packages are reported as SKIPPED_NO_CHECKUPDATES.
#repo_mode = "pacman"
#
# system_upgrade — false (default) | true — finish every `sysforge update`
#   run with a single `sudo pacman -Syu`. Independent of repo_mode: no extra
#   packages enter the version-check walk and no `checkupdates` probe runs —
#   pacman resolves the transaction itself. It fires after the source-built
#   artifacts are installed, so the `IgnoreGroup = sf-build` line from
#   `sysforge setup` protects them. --sysupgrade / --no-sysupgrade override
#   per run.
#system_upgrade = false
#
# review — PKGBUILD review gate: before building a package whose source
#   changed since the last accepted build, show the full source-tree diff
#   and prompt (view/accept/skip/abort). false disables the gate;
#   --no-review disables per run. Non-interactive runs auto-accept with a
#   warning.
#review = true
#
# Standing defaults for build-run flags. The matching CLI flags
# (--abi-check / --cache-report / --persist-log) still win when passed.
# Note: --force ignores these (explicit this-run-only override).
#
# abi_check — run post-build ABI check (build verb)
#abi_check = false
#
# cache_report — print ccache/sccache summary after each build
#cache_report = false
#
# persist_log — keep the per-package log after a successful build
#persist_log = false


# =============================================================================
# Package groups — named sets that expand into [[package]] entries at load
# time, so a desktop stack can be tracked without enumerating every member.
#
#   [group.<name>]
#
#   packages — required: member package names
#   packages = ["pkg-a", "pkg-b"]
#   # Optional defaults inherited by every member (an explicit [[package]]
#   # entry for the same name wins outright):
#   # source = "aur"
#   # enable_build_from_source = true
#   # cache = false
#
# Members are installed by `run packages` (bootstrap) like any entry; at
# steady-state (`sysforge update`) a member with no defaults is an inert
# override, exactly like a bare [[package]] entry — no warning is emitted
# for group members.
#
# Curated desktop-environment groups can be written without hand-editing TOML:
#   sysforge packages add-group gnome      # or: kde
# The bootstrap configure stage offers the same selection (or reads it from
# bootstrap.toml [desktop] environment for unattended installs).
# =============================================================================

#[group.cosmic]
#packages = ["cosmic-session-git", "cosmic-comp-git", "cosmic-settings-git"]


# =============================================================================
# SysForge recommended dependencies
#
# ccache/sccache are used automatically when a profile enables them in
# profiles.toml — the "ccache" token in BUILDENV, plus RUSTC_WRAPPER /
# CCACHE_DIR / SCCACHE_DIR in the profile's env keys. Set `cache = false` on a
# [[package]] entry above to opt a single package out (required for PGO).
# reflector is used by the configure stage to set up /etc/pacman.d/mirrorlist.
# =============================================================================

#[[package]]
#name = "sysforge-git"
#source = "aur"
