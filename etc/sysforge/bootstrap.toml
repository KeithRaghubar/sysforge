# =============================================================================
# bootstrap.toml — SysForge bootstrap configuration
#
# Used by the bootstrap pipeline stages (partition, base_install, hardware,
# configure). Edit this file before running sysforge run pipeline from a live
# Arch install environment.
#
# Run with a custom state dir so pipeline state persists into the installed
# system:
#   sysforge run pipeline --state-dir /mnt/var/lib/sysforge
#
# After rebooting into the installed system, continue with:
#   sysforge run pipeline --start-from reconfigure
# =============================================================================

# Mount point for the new system during install.
target = "/mnt"


# =============================================================================
# Partition configuration (stage 1)
# =============================================================================

[partition]
# Block device to partition. CAUTION: all data will be destroyed.
# device = "/dev/sda"

# EFI System Partition size in MiB. 512 MiB is sufficient for multiple kernels.
esp_size_mib = 512

# Root filesystem type: "ext4" (default) | "btrfs"
root_fs = "ext4"


# =============================================================================
# System identity (stage 4)
# =============================================================================

[system]
# hostname   = "archlinux"
# locale     = "en_US.UTF-8"
# timezone   = "UTC"
# keymap     = "us"

# Default login shell: "bash" (default) | "zsh"
# shell = "bash"

# pacman ParallelDownloads (default: 5)
# parallel_downloads = 5

# Account created by the base_install stage. Defaults to "builder".
# username = "builder"

# Passwords applied during base_install. Leave unset to skip (run `passwd`
# manually inside the chroot or after first boot). Values are not retained
# on disk after a successful pipeline run.
# user_password = ""
# root_password = ""


# =============================================================================
# Mirrorlist (stage 4 — requires reflector in the chroot)
# =============================================================================

[mirror]
# Full country NAMES (not ISO codes) for reflector --country. Omit to use all
# mirrors. Must be names — archinstall's mirror region selection keys on the
# full name and rejects a bare code like "CA". Good: ["Canada"], not ["CA"].
# countries = ["Canada"]
protocol = "https"
age      = 12


# =============================================================================
# Desktop environment (stage 4 — optional)
# =============================================================================
#
# Pick a curated desktop environment to install as a packages.toml [group.*]
# table; the packages stage installs it later in the same pipeline (and enables
# the matching display manager so the system boots to a graphical login).
# Supported values: "gnome" | "kde" | "xfce" | "mate" | "cinnamon" | "lxqt" |
# "budgie" | "cosmic".
#
#   - set here       → installed non-interactively (unattended installs)
#   - unset + a TTY  → the configure stage prompts
#   - unset, no TTY  → no desktop is installed
#
# You can also add one any time on a running system with:
#   sysforge packages add-group gnome
#
# [desktop]
# environment = "gnome"


# =============================================================================
# makepkg defaults (stage 4 — optional)
# =============================================================================
#
# Stamp common makepkg.conf settings into the target /etc/makepkg.conf during
# the configure stage. A fresh makepkg.conf ships PACKAGER="Unknown Packager"
# and no MAKEFLAGS (single-threaded builds), so set these for unattended
# installs. On a running system, the `sysforge reconfigure` makepkg step offers
# the same settings interactively.
#
# [makepkg]
# packager  = "Your Name <you@example.com>"
# makeflags = "-j8"
