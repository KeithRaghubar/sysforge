# =============================================================================
# append_conflict_groups.toml — mutually exclusive flag groups for token merges
#
# Used by [profiles.NAME.append] token-level merges. When a token being
# appended belongs to a conflict group, all other members of that group are
# removed from the accumulated flag string before the new token is inserted.
#
# Example: if the parent profile has "-fstack-protector" and an append rule
# adds "-fstack-protector-strong", the "stack" group ensures the weaker flag
# is removed rather than both being present.
# =============================================================================

[conflict_groups]

# Position-independent code / executable flags
pic   = ["-fPIC", "-fPIE", "-fpic", "-fpie", "-fno-pic", "-fno-pie"]

# Link-time optimisation variants
lto   = ["-flto", "-flto=thin", "-flto=full", "-fno-lto"]

# Stack protection
stack = ["-fstack-protector", "-fstack-protector-strong", "-fno-stack-protector"]
