# =============================================================================
# kernel.toml — custom kernel build (stage 8 / sysforge run kernel)
#
# This stage is opt-in. Building a custom kernel is a deliberate choice;
# most users should leave this disabled and rely on a stock pacman kernel.
# Set enabled = true and fill in the required fields below to build and
# install a custom kernel.
#
# The kernel PKGBUILD must already be cloned under [paths] pkgbuild_src_dir in
# flag_profiles.toml. A [[rules]] entry with profile = "kernel" is also
# expected (provided in the default flag_profiles.toml).
# =============================================================================

enabled = false

# ---------------------------------------------------------------------------
# Required fields
# ---------------------------------------------------------------------------

pkgname = "linux-sysforge"      # base package name (must match the PKGBUILD pkgbase)
# srcdir  = "linux"             # subdirectory inside pkgbuild_src_dir containing the PKGBUILD

# ---------------------------------------------------------------------------
# Optional fields
# ---------------------------------------------------------------------------

# bootloader = "systemd-boot"   # "systemd-boot" | "grub" | "none"
#                               # controls post-install bootloader update step:
#                               #   systemd-boot → `sudo bootctl update`
#                               #   grub         → `sudo grub-mkconfig -o /boot/grub/grub.cfg`
#                               #   none         → skip
#                               # default: "systemd-boot"
#                               # CLI override: `sysforge run kernel --bootloader grub`

# interactive = true            # default: true — the PKGBUILD's `make nconfig`
#                               # / `menuconfig` runs as written so the user can
#                               # review/edit the resolved kconfig. Set to false
#                               # (or pass `--non-interactive`) to patch interactive
#                               # targets to `make olddefconfig` for unattended runs.

# compiler = "gcc"              # "gcc" | "llvm" — kernel-stage compiler override.
#                               # Independent of the global toolchain stage, so a
#                               # system that keeps gcc as its default can still
#                               # build the kernel with LLVM (or vice versa).
#                               # Resolution order: --compiler CLI flag > this
#                               # field > toolchain-stage pipeline state. When
#                               # unset, the kernel inherits whatever the
#                               # toolchain stage registered (or profile defaults
#                               # when toolchain is disabled).
#                               # NOTE: compiler = "llvm" builds the kernel WITH
#                               # clang; it does NOT apply PGO profile data. The
#                               # profdata trains the clang binary itself, not the
#                               # linux kernel target — there is no kernel PGO here.

# pkgbuild_src_dir = "~/src"    # override the global pkgbuild_src_dir for this kernel only

# ---------------------------------------------------------------------------
# Boot safety — the kernel stage must never leave the system unbootable.
#
# Three gates wrap the build/install: a pre-build preflight (fallback-kernel
# guarantee + /boot space), a resolved-.config audit between build and install
# (aborts before install if the built kernel drops the root filesystem, storage
# controller, or core boot infrastructure), and a post-install boot-readiness
# check (vmlinuz + initramfs present and referenced by a boot entry; DKMS
# modules rebuilt). Brick-class findings hard-fail; everything else warns.
# See DESIGN.md §Kernel stage boot-safety.
# ---------------------------------------------------------------------------

# require_fallback_kernel = true  # default: true — refuse to install a custom
#                                 # kernel unless a stock linux/linux-lts (with a
#                                 # boot image) exists, so a broken build still
#                                 # has a recovery path. CLI: --allow-no-fallback

# boot_audit = true               # default: true — run the /boot space check and
#                                 # the pre-install resolved-.config audit (Gate 2).
#                                 # CLI override for the audit: --skip-boot-audit

# min_boot_free_mb = 200          # default: 200 — minimum free MiB on /boot before
#                                 # building, so a kernel + initramfs install isn't
#                                 # truncated.

# capture_lsmod_snapshot = true   # default: true — capture lsmod for the PKGBUILD's
#                                 # `make localmodconfig`. Set false if you don't want
#                                 # drivers for currently-inactive hardware stripped.

# base_config = "pkgbuild"        # default: "pkgbuild" — where the build's
#                                 # *starting* .config comes from, before the
#                                 # sysforge.config fragment is overlaid:
#                                 #   "pkgbuild" → the PKGBUILD's own base config
#                                 #               (no seeding; current behaviour)
#                                 #   "running"  → the running kernel's config
#                                 #               (/proc/config.gz, then
#                                 #                /boot/config-$(uname -r))
#                                 #   "<path>"   → read the base from that file
#                                 # For "running"/<path>, sysforge writes the
#                                 # chosen config to <pkgbuild_dir>/sysforge.base.config;
#                                 # the PKGBUILD's prepare() must copy it to .config
#                                 # (then `make olddefconfig`) BEFORE merging
#                                 # sysforge.config — same cooperation contract as
#                                 # the fragment below.

# ---------------------------------------------------------------------------
# kconfig — kernel config fragment
#
# Entries are written to a sysforge.config fragment and applied via
# scripts/config before the build. Manual entries override hardware_profile
# entries on conflict (with a warning).
#
# [kconfig]
# CONFIG_HZ_1000 = "y"
# CONFIG_NO_HZ_FULL = "y"
# CONFIG_PREEMPT = "y"
# ---------------------------------------------------------------------------
