# =============================================================================
# profiles.toml — compiler flag profiles, package matching rules, and
# flag-resolution reference data (conflict groups + consumes inference)
#
# Everything down to line 220 ("END OF HEADER") is documentation;
# the settings themselves start below it.
#
# SysForge resolves a profile for each package by evaluating [[rules]] in
# priority order. The highest-priority matching rule wins; [defaults] profile
# is used when no rule matches.
#
# Tables in this file:
#   [paths] [defaults] [profiles.*] [[rules]]   — profile selection
#   [append_conflict_groups]                    — mutually exclusive flag sets
#   [preserved_system_tokens]                   — system tokens kept across an override
#   [consumes_inference]                        — makedepends → conf type map
#
# COMMENT CONVENTION — two kinds of `#` lines appear below:
#   # text          prose. Explanation only; nothing to uncomment.
#   #key = value    a real setting, shown at its default or with an example
#                   value. Delete the single leading `#` to activate it.
# The only activatable blocks in this file are the [[rules]] examples under
# "Rules — add your own below", and each needs its whole block (a rule's
# `profile` and `priority` are required), so uncomment all of one or none.
# Every other table here is already live. The indented key reference that
# follows is prose throughout — it documents each key's syntax in place, so
# uncommenting a line there would land it outside the table it belongs to.
# =============================================================================
#
# ── [paths] ──────────────────────────────────────────────────────────────────
#
#   pkgbuild_src_dir — directory searched for PKGBUILDs by bare package name;
#     sysforge build/resolve <name> looks here first
#   pkgbuild_src_dir = "~/src"
#
# ── [defaults] profile keys (also valid in any [profiles.NAME]) ──────────────
#
#   BUILDDIR — overrides system makepkg.conf BUILDDIR (where src/pkg go); set
#     in [profiles.bare] so all profiles inherit it
#   BUILDDIR = "$HOME/builds"
#
# ── [defaults] ───────────────────────────────────────────────────────────────
#
#   profile — (required) fallback when no rule matches
#   profile = "standard"
#
#   append_groups — (optional) groups added to every package
#   append_groups = ["sf-build"]
#
#   toolchain — (optional) global package-compiler default: "gcc" | "llvm".
#     Expands to the compiler bundle below for any profile that doesn't set
#     its own `toolchain` (or explicit CC/CXX). When the toolchain stage runs
#     (toolchain.toml enabled), it rewrites THIS key to match toolchain.toml's
#     `compiler`, so the package default tracks the registered system
#     compiler.
#   toolchain = "gcc"
#
# ── [profiles.NAME] ──────────────────────────────────────────────────────────
#
#   extends — (optional) parent profile; child keys override
#     [profiles.NAME.append] does token-level merge
#   extends = "bare"
#
#   # Compiler / linker
#   toolchain — "gcc" | "llvm" — selects the compiler bundle. One field
#     instead of hand-setting the keys below; explicit keys always override
#     the bundle.
#       gcc  → CC=gcc,   CXX=g++,    system binutils
#       llvm → CC=clang, CXX=clang++, AR/NM/RANLIB/STRIP=llvm-*, and
#              -fuse-ld=lld added to LDFLAGS when no -fuse-ld= is already
#              declared.
#   toolchain = "gcc"
#   # Individual overrides (written to temp makepkg.conf; each wins over the
#   # bundle above):
#   # CC     = "clang"
#   # CXX    = "clang++"
#   # AR     = "llvm-ar"
#   # NM     = "llvm-nm"
#   # RANLIB = "llvm-ranlib"
#   # STRIP  = "llvm-strip"
#   CFLAGS   = "-march=native -O3 -pipe -fno-plt"
#   CXXFLAGS = "$CFLAGS"
#   CPPFLAGS = "-D_FORTIFY_SOURCE=2"
#
#   LDFLAGS — use -fuse-ld=lld to select lld. Flag guards in
#     emit_makepkg_conf handle incompatibilities automatically: lld-only
#     flags (--icf=*) stripped when lld is not the linker; RUSTFLAGS linker
#     reconciled to match LDFLAGS; -flto=thin rewritten to -flto for GCC;
#     LTO disabled entirely when CC=gcc + linker=lld (GCC LTO bitcode is
#     incompatible with lld).
#   LDFLAGS  = "-fuse-ld=lld -Wl,-O1,--sort-common,--as-needed,-z,relro,-z,now,--icf=all"
#   DEBUG_CFLAGS   = "-g"
#   DEBUG_CXXFLAGS = "-g"
#   DEBUG_LDFLAGS  = ""
#   MAKEFLAGS      = "-j$(nproc)"
#
#   # makepkg options  (written to temp makepkg.conf)
#   BUILDENV = ["!distcc", "color", "ccache", "check", "!sign"]
#   OPTIONS  = ["strip", "docs", "libtool", "staticlibs", "emptydirs", "!zipman", "purge", "!debug", "lto"]
#   PKGEXT   = ".pkg.tar.zst"
#   SRCEXT   = ".src.tar.gz"
#   INTEGRITY_CHECK = ["sha256"]
#
#   # Rust  (written to temp makepkg.conf; only when 'rust' in consumes)
#   RUSTFLAGS                           = "-C opt-level=3 -C target-cpu=native"
#   CARGO_PROFILE_RELEASE_LTO           = "thin"   # "thin" | "fat" | "off"
#   CARGO_PROFILE_RELEASE_CODEGEN_UNITS = "1"
#   CARGO_PROFILE_RELEASE_OPT_LEVEL     = "3"      # "0".."3" | "s" | "z"
#   CARGO_INCREMENTAL                   = "0"      # always 0 with managed flags
#
#   # CMake  (written to temp makepkg.conf; only when 'cmake' in consumes)
#   CMAKE_BUILD_TYPE          = "Release"   # "Release" | "RelWithDebInfo" | "Debug"
#   CMAKE_C_FLAGS             = "-march=native"
#   CMAKE_CXX_FLAGS           = "-march=native"
#   CMAKE_EXE_LINKER_FLAGS    = "-fuse-ld=lld"
#   CMAKE_SHARED_LINKER_FLAGS = "-fuse-ld=lld"
#
#   # Meson  (written to temp makepkg.conf; only when 'meson' in consumes)
#   MESON_ARGS = "--buildtype=release --optimization=3"
#
#   # Env-injected  (passed directly to makepkg subprocess env, not the conf)
#   RUSTC_WRAPPER                = "sccache"    # or "ccache"
#   CCACHE_DIR                   = "/var/cache/ccache"
#   SCCACHE_DIR                  = "/var/cache/sccache"
#   CARGO_HOME                   = "/var/cache/cargo"
#
#   CARGO_NET_GIT_FETCH_WITH_CLI — avoids SSH auth failures in build envs
#   CARGO_NET_GIT_FETCH_WITH_CLI = "true"
#   PKG_CONFIG_PATH              = "/usr/local/lib/pkgconfig"
#
#   # makepkg invocation flags
#   makepkg_flags — common: --noconfirm --syncdeps --rmdeps --install
#     --noprogressbar --log --cleanbuild --force
#   makepkg_flags = ["--noconfirm", "--syncdeps"]
#
#   # SysForge behaviour keys  (not written to conf or env)
#   build_mode — "source_built" | "pgo_llvm_toolchain" | "kernel"; omit for
#     standard builds. "source_built" extracts the PKGBUILD's embedded
#     profile (legacy token "patched_pkgbuild" still accepted on read).
#     Optimization modes (pgo_mesa/pgo/autofdo_kernel/…) are stamped at
#     build time, not set here.
#   build_mode    = "source_built"
#
#   clean_builddir — wipe src/ before build (default: false)
#   clean_builddir = true
#
#   preserve_system_tokens — re-add the [preserved_system_tokens] flags from
#     /etc/makepkg.conf after this profile's CFLAGS/CXXFLAGS override drops
#     them (default: true). Set false to take the profile's flag string
#     verbatim, hardening included. Per-token opt-out is finer: name the
#     conflicting flag (e.g. "-fno-stack-protector") in the profile's flags.
#   preserve_system_tokens = false
#
#   sandbox_builds — run this profile's builds inside a clean container
#     (devtools' makechrootpkg) instead of as the invoking user. Overrides
#     [security] sandbox_builds in sysforge.toml, both ways: opt a profile
#     used for untrusted AUR packages in while the global default stays off,
#     or opt a profile whose packages you audit yourself out of the cost.
#     Requires devtools and an existing chroot root — see [security] in
#     sysforge.toml. Never applied to `run toolchain` / `run kernel`.
#   sandbox_builds = true
#
#   batch — abort on failure without prompting (default: false)
#   batch          = true
#
#   consumes — override auto-inferred consumes; omit to infer from makedepends
#   consumes       = ["makepkg", "rust", "cmake", "meson", "env"]
#
#   # CPU/IO/memory throttling — per-profile override of [build] in sysforge.toml.
#   # Set on a heavy profile (e.g. an LLVM/PGO build) to throttle just those.
#   # A key present here wins over the global default; an absent key falls back
#   # to it. See sysforge.toml's [build] block for the full semantics.
#   nice       = 19                     # scheduling niceness 0..19 (soft yield)
#   ionice     = "idle"                 # IO class: "idle" | "best-effort"
#
#   cpu_quota — hard CPU ceiling via systemd scope: "N%" (100% = one core) or
#     a decimal fraction of this host's cores (0.75 → 12 of 16)
#   cpu_quota  = "600%"
#
#   jobs       = 6                      # parallel jobs; rewrites -j in MAKEFLAGS
#
#   mem_limit — per-build memory ceiling (cgroup MemoryMax, or RLIMIT_AS
#     without systemd-run): a bare byte count or a binary size suffix
#     (e.g. "24G", "512M")
#   mem_limit  = "24G"
#
# ── [profiles.NAME.append] ───────────────────────────────────────────────────
#
#   Token-level merge into the parent's value instead of full override.
#   Conflict groups ([append_conflict_groups] below) are resolved during merge.
#
#   [profiles.optimized_lto.append]
#   CFLAGS — replaces -flto* in parent via conflict group
#   CFLAGS  = "-flto=thin"
#   LDFLAGS — appended (no conflict group)
#   LDFLAGS = "--icf=all"
#
# ── [[rules]] ────────────────────────────────────────────────────────────────
#
#   profile — (required) profile to apply when this rule matches
#   profile  = "optimized"
#
#   priority — (required) 0–99; higher priority wins on conflict
#   priority = 0
#
#   # Match fields — all optional; omitting passes unconditionally
#   pkgnames        = ["htop", "htop-*"]       # ANY match; fnmatch globs
#   not_pkgnames    = ["llvm-*"]               # ALL absent; fnmatch globs
#   groups          = ["cosmic-*"]             # ALL match; fnmatch globs
#   not_groups      = ["multilib"]             # ALL absent; exact
#   depends_any     = ["libfoo.so"]            # ANY present; exact
#   depends_all     = ["glibc", "gcc-libs"]    # ALL present; exact
#   not_depends     = ["qt5-base"]             # ALL absent; exact
#   makedepends_any = ["cargo"]                # ANY present; exact
#   makedepends_all = ["cmake", "ninja"]       # ALL present; exact
#   not_makedepends = ["meson"]                # ALL absent; exact
#
#   append_groups = ["pgo", "lto"]   # additive across all matched rules
#
# ============================== END OF HEADER ================================

[paths]
pkgbuild_src_dir = "~/src"

[defaults]
profile = "standard"
append_groups = ["sf-build"]
toolchain = "gcc"   # global package-compiler default: "gcc" | "llvm" (see header)

# =============================================================================
# Profiles
# =============================================================================

[profiles.bare]
# Fallback — no flags injected
BUILDDIR = "$HOME/builds"

[profiles.standard]
extends = "bare"
# Compiler comes from the `toolchain` field (defaults to "gcc" via [defaults]).
# That expands to CC=gcc/CXX=g++ + system binutils, or CC=clang/CXX=clang++ +
# llvm-* binutils + -fuse-ld=lld for "llvm". Set `toolchain = "llvm"` here or in
# a rule to switch, or override individual CC/CXX/AR/… keys to win over it.
CFLAGS   = "-march=native -O2 -pipe"
CXXFLAGS = "$CFLAGS"
LDFLAGS  = "-Wl,-O1,--sort-common,--as-needed,-z,relro,-z,now"
CARGO_NET_GIT_FETCH_WITH_CLI = "true"
RUSTC_WRAPPER                = "sccache"
makepkg_flags = ["--noconfirm", "--syncdeps"]

[profiles.optimized]
extends = "standard"
CFLAGS  = "-march=native -O3 -pipe -fno-plt"
LDFLAGS = "-fuse-ld=lld -Wl,-O1,--sort-common,--as-needed,-z,relro,-z,now,--icf=all"
makepkg_flags = ["--noconfirm", "--syncdeps", "--cleanbuild"]

[profiles.pgo_llvm_toolchain]
extends = "optimized"
build_mode = "pgo_llvm_toolchain"

[profiles.patched]
extends = "optimized"
build_mode = "source_built"   # extracts the PKGBUILD's embedded profile (was "patched_pkgbuild")

[profiles.kernel]
extends = "bare"
build_mode = "kernel"
batch = true
makepkg_flags = ["--noconfirm", "--syncdeps", "-f", "-c"]

[profiles.batch]
extends = "standard"
batch = true
clean_builddir = true
makepkg_flags = ["--noconfirm", "--syncdeps", "--rmdeps", "--install", "--noprogressbar", "--log", "--cleanbuild"]

# =============================================================================
# Rules — add your own below
# =============================================================================

# Example: match a specific package
#[[rules]]
#pkgnames = ["htop"]
#profile  = "optimized"
#priority = 0

# Example: match any package using cmake + ninja
#[[rules]]
#makedepends_all = ["cmake", "ninja"]
#profile         = "optimized"
#priority        = 5

# Example: LLVM toolchain packages (used with sysforge run toolchain)
#[[rules]]
#pkgnames = ["llvm", "clang", "lld"]
#profile  = "pgo_llvm_toolchain"
#priority = 20
#append_groups = ["pgo"]

# Example: custom kernel (pkgnames must match kernel.toml's pkgname default)
#[[rules]]
#pkgnames = ["linux-sysforge"]
#profile  = "kernel"
#priority = 20

# =============================================================================
# Append conflict groups — mutually exclusive flag sets for token-level merges
#
# When a token in [profiles.NAME.append] belongs to a conflict group, all other
# members of that group are removed from the accumulated flag string before the
# new token is inserted. Example: appending "-fstack-protector-strong" removes
# "-fstack-protector" from the parent's flags via the "stack" group.
# =============================================================================

[append_conflict_groups]

# Position-independent code / executable flags
pic   = ["-fPIC", "-fPIE", "-fpic", "-fpie", "-fno-pic", "-fno-pie"]

# Link-time optimisation variants
lto   = ["-flto", "-flto=thin", "-flto=full", "-fno-lto"]

# Stack protection
stack = ["-fstack-protector", "-fstack-protector-strong", "-fno-stack-protector"]

# =============================================================================
# Preserved system tokens — hardening flags that survive a profile override
#
# Profile keys overwrite their system counterparts wholesale, per key, not per
# token. A profile that rewrites CFLAGS around -march/-O therefore drops the
# rest of /etc/makepkg.conf's CFLAGS — including the compiler hardening tokens
# the distro sets (FORTIFY_SOURCE, the stack protector, format-string
# rejection). Tokens listed here are re-added from the system value after the
# override, with the profile winning every conflict:
#
#   - already in the profile value        -> left alone
#   - profile names a conflicting token   -> not re-added (explicit opt-out,
#     via [append_conflict_groups]: "-fno-stack-protector" keeps the stack
#     protector out)
#   - profile names the same flag family  -> profile's value wins
#     ("-Wp,-D_FORTIFY_SOURCE=2" is not overwritten by the system's "=3")
#
# Only tokens the system conf actually sets are ever restored; nothing here
# invents a flag. A profile opts out of the whole pass with
# `preserve_system_tokens = false`. Kernel builds never reach this pass — their
# flag keys pass through from the system conf verbatim.
# =============================================================================

[preserved_system_tokens]

CFLAGS   = [
  "-fexceptions",
  "-Wp,-D_FORTIFY_SOURCE=3",
  "-Wformat",
  "-Werror=format-security",
  "-fstack-protector-strong",
  "-fstack-clash-protection",
  "-fcf-protection",
]
CXXFLAGS = [
  "-fexceptions",
  "-Wp,-D_FORTIFY_SOURCE=3",
  "-Wformat",
  "-Werror=format-security",
  "-fstack-protector-strong",
  "-fstack-clash-protection",
  "-fcf-protection",
]

# =============================================================================
# Consumes inference — makedepends → conf type routing
#
# Maps a makedepends token to the set of conf types SysForge delivers for that
# build system. The union of all matched tools forms the package's "consumes"
# set, which controls which profile keys (CFLAGS, RUSTFLAGS, CMAKE_*,
# MESON_ARGS, etc.) are written to the temp makepkg.conf or injected into env.
# A per-profile `consumes = [...]` overrides this inference entirely.
#
# Conf types:
#   makepkg  — CFLAGS / CXXFLAGS / LDFLAGS / BUILDENV / OPTIONS / etc.
#   rust     — RUSTFLAGS / CARGO_* keys
#   cmake    — CMAKE_* keys
#   meson    — MESON_ARGS
#   env      — env-injected keys (RUSTC_WRAPPER, CCACHE_DIR, CARGO_HOME, etc.)
# =============================================================================

[consumes_inference]
cargo      = ["makepkg", "rust", "env"]
rust       = ["makepkg", "rust", "env"]
rustup     = ["makepkg", "rust", "env"]
lib32-rust = ["makepkg", "rust", "env"]
meson      = ["makepkg", "meson", "env"]
cmake      = ["makepkg", "cmake", "env"]
ninja      = ["makepkg", "env"]
make       = ["makepkg", "env"]
python     = ["makepkg", "env"]
git        = ["makepkg"]

# Auto-managed by sysforge — compiler/linker overrides recovered from build
# failures (sysforge build's interactive recovery menu, [c] swap). Keyed by
# pkgbase; applied last in resolve_profile, so a row here wins over the matched
# profile's CC/CXX/LD for that package. Safe to edit or delete by hand.
[package_compiler_overrides]
