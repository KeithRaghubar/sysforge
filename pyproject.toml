[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sysforge"
version = "0.2.0"
description = "All-in-one Arch Linux helper for system setup and package management with compiler-optimized builds"
requires-python = ">=3.11"
dependencies = [
    "tomli>=2.0; python_version<'3.11'",  # fallback if ever needed
]

[project.scripts]
sysforge = "sysforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["sysforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# SYSFORGE_CONFIG_DIR is set in tests/conftest.py before any imports.
# Verbose output so rule parametrize IDs are readable.
addopts = "-v"
