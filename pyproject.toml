[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sysforge"
version = "0.1.0"
description = "Reproducible, performance-tuned Arch Linux installer"
requires-python = ">=3.11"
dependencies = [
    "tomli>=2.0; python_version<'3.11'",  # fallback if ever needed
]

[project.scripts]
sysforge = "sysforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["sysforge"]
