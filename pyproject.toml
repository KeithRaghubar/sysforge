[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sysforge"
version = "3.2.0"
description = "Arch Linux build and maintenance suite for system setup and package management with compiler-optimized builds"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "tomli>=2.0; python_version<'3.11'",  # fallback if ever needed
]

[project.optional-dependencies]
# `extra` is opt-in fast-path bindings. Install with `uv sync --extra extra`
# or via the system package (`pacman -S pyalpm`). When pyalpm is present,
# sysforge.primitives.pacman uses libalpm for read queries; otherwise it
# falls back to subprocess `pacman -Q*`. Set SYSFORGE_PACMAN_NO_PYALPM=1
# to force the subprocess path for parity testing.
extra = [
    "pyalpm>=0.10.6",
]

[project.scripts]
sysforge = "sysforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["sysforge"]

# Ship the pacman hook sources + helper inside the wheel so an installed
# sysforge (not just a source checkout) has a canonical copy to provision/
# verify against. Consumed by primitives/pacman_hooks.py; the PKGBUILD still
# installs the live copies into /usr/share/libalpm/hooks and /usr/lib/sysforge.
[tool.hatch.build.targets.wheel.force-include]
"etc/pacman.d/hooks" = "sysforge/_data/pacman-hooks"
"tools/pacman-hook-helper.sh" = "sysforge/_data/pacman-hook-helper.sh"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# SYSFORGE_CONFIG_DIR is set in tests/conftest.py before any imports.
# Verbose output so rule parametrize IDs are readable.
addopts = "-v"

[tool.pyright]
# Ruff owns lint-style diagnostics; disable the pyright checks that overlap
# so editors don't double-report. Pyright remains the type-analysis authority.
#   reportUnusedImport     -> ruff F401
#   reportUnusedVariable   -> ruff F841
#   reportUnusedExpression -> ruff B018
#   reportDuplicateImport  -> ruff F811
reportUnusedImport = "none"
reportUnusedVariable = "none"
reportUnusedExpression = "none"
reportDuplicateImport = "none"

[tool.ruff]
# The codebase was informally written to ~100 cols (454 lines over 88, only
# 125 over 100). 100 ratifies the existing grain; see 2.3.0-F1.
line-length = 100

[tool.ruff.lint]
# Security (bandit port `S`), bug-prone patterns (`B`), simplifications (`SIM`),
# and pathlib migration (`PTH`) on top of the pyflakes/pycodestyle baseline.
# E501 enables the line-length=100 enforcement above (it lives in the E5 group,
# which the E4/E7/E9 selectors do not cover). 2.3.0-STD1 governs the
# subprocess-seam discipline the noisy S-rules can't.
select = ["E4", "E7", "E9", "E501", "F", "S", "B", "SIM", "PTH"]
ignore = [
    # E402: SysForge modules deliberately set `_log = log.get_logger("TAG")`
    # between imports so the logger binds to the module's tag. Pure, no side effect.
    "E402",
    # S603: subprocess-without-shell=True fires on every safe argv-list call
    # (124 sites). 2.3.0-STD1's run_seam check governs the actual seam discipline.
    "S603",
    # S607: partial-executable-path fires on every intentional PATH lookup
    # (101 sites) — PATH resolution is deliberate for a CLI tool.
    "S607",
]

[tool.ruff.lint.per-file-ignores]
# Test code is not production attack surface: pytest uses bare `assert` (S101),
# fixtures construct throwaway /tmp paths (S108) and dummy credentials
# (S105–S107), and exercise the subprocess/shell seams directly (S602/S604).
# The bandit `S` rules target shipped code. (2.3.0-F1)
#
# PTH and SIM117 join them at 2.6.1-STD8, when `make lint` grew to cover
# tests/ and tools/. Both fire almost exclusively on idioms that are correct in
# test code: PTH on the `sys.path.insert(0, os.path.join(os.path.dirname(
# __file__), ".."))` import bootstrap repeated across ~25 files, and SIM117 on
# nested `with` blocks stacking monkeypatch/mock context managers, where
# collapsing them produces one over-long line per test and reads worse. Neither
# is relaxed for sysforge/ or tools/, where pathlib migration and `with`-depth
# are real signals about code that handles user paths.
"tests/**" = ["S", "PTH", "SIM117"]

# Coverage is run via `make coverage`, which layers pytest-cov into an
# ephemeral `uv run --no-sync --with pytest-cov` overlay (no system/venv
# mutation). The baseline that the refactor ratchets against lives in
# tests/COVERAGE_BASELINE.md.
[tool.coverage.run]
source = ["sysforge"]
branch = true

[tool.coverage.report]
show_missing = true
precision = 1
