# =============================================================================
# Append conflict groups
#
# Defines sets of mutually exclusive flags for use with [profiles.x.append]
# token-level merges. When a child token belongs to a conflict group, all other
# members of that group are removed from the accumulated token list before the
# child token is inserted.
#
# Groups here match the inline CONFLICT_GROUPS constant in test_append_merge.py.
# Keep in sync if either is changed.
# =============================================================================

[conflict_groups]

# Position-independent code / executable flags — mutually exclusive
pic   = ["-fPIC", "-fPIE", "-fpic", "-fpie", "-fno-pic", "-fno-pie"]

# Link-time optimisation variants — mutually exclusive
lto   = ["-flto", "-flto=thin", "-flto=full", "-fno-lto"]

# Stack protection — mutually exclusive
stack = ["-fstack-protector", "-fstack-protector-strong", "-fno-stack-protector"]
