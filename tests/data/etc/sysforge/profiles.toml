# =============================================================================
# profiles.toml — compiler flag profiles, package matching rules, and
# flag-resolution reference data (conflict groups + consumes inference)
#
# Tables in this file:
#   [paths] [defaults] [profiles.*] [[rules]]   — profile selection
#   [append_conflict_groups]                    — mutually exclusive flag sets
#   [consumes_inference]                        — makedepends → conf type map
#
# REFERENCE — all valid keys and accepted values
# =============================================================================
#
# ── [paths] ──────────────────────────────────────────────────────────────────
#
#   pkgbuild_src_dir = "~/src"    # directory searched for PKGBUILDs by bare package name
#                                 # sysforge build/resolve <name> looks for <pkgbuild_src_dir>/<name>/PKGBUILD
#
# ── [defaults] ───────────────────────────────────────────────────────────────
#
#   profile = "standard"          # (required) fallback profile when no rule matches
#   append_groups = ["sf-build"]  # (optional) groups added to every package
#
# ── [profiles.NAME] ──────────────────────────────────────────────────────────
#
#   extends = "bare"              # (optional) parent profile — inherits all parent keys;
#                                 #   child keys override, [profiles.NAME.append] merges
#
#   # Compiler / linker  (delivered via temp makepkg.conf)
#   CC       = "clang"
#   CXX      = "clang++"
#   AR       = "llvm-ar"
#   NM       = "llvm-nm"
#   RANLIB   = "llvm-ranlib"
#   STRIP    = "llvm-strip"
#   CFLAGS   = "-march=native -O3 -pipe -fno-plt"
#   CXXFLAGS = "$CFLAGS"
#   CPPFLAGS = "-D_FORTIFY_SOURCE=2"
#   LDFLAGS  = "-fuse-ld=lld -Wl,-O1,--sort-common,--as-needed,-z,relro,-z,now,--icf=all"
#             # Use -fuse-ld=lld to select lld. Flag guards in emit_makepkg_conf
#             # handle incompatibilities automatically: lld-only flags (--icf=*)
#             # stripped when lld is not the linker; RUSTFLAGS linker reconciled
#             # to match LDFLAGS; -flto=thin rewritten to -flto for GCC; LTO
#             # disabled entirely when CC=gcc + linker=lld (GCC LTO bitcode is
#             # incompatible with lld).
#   DEBUG_CFLAGS   = "-g"
#   DEBUG_CXXFLAGS = "-g"
#   DEBUG_LDFLAGS  = ""
#   MAKEFLAGS      = "-j$(nproc)"
#
#   # makepkg options  (delivered via temp makepkg.conf)
#   BUILDENV = ["!distcc", "color", "ccache", "check", "!sign"]
#   OPTIONS  = ["strip", "docs", "libtool", "staticlibs", "emptydirs", "!zipman", "purge", "!debug", "lto"]
#   PKGEXT   = ".pkg.tar.zst"
#   SRCEXT   = ".src.tar.gz"
#   INTEGRITY_CHECK = ["sha256"]
#
#   # Rust  (delivered via temp makepkg.conf; only when 'rust' in consumes)
#   RUSTFLAGS                          = "-C opt-level=3 -C target-cpu=native"
#   CARGO_PROFILE_RELEASE_LTO          = "thin"   # "thin" | "fat" | "off"
#   CARGO_PROFILE_RELEASE_CODEGEN_UNITS = "1"
#   CARGO_PROFILE_RELEASE_OPT_LEVEL    = "3"      # "0".."3" | "s" | "z"
#   CARGO_INCREMENTAL                  = "0"       # always 0 with managed flags
#
#   # CMake  (delivered via temp makepkg.conf; only when 'cmake' in consumes)
#   CMAKE_BUILD_TYPE        = "Release"   # "Release" | "RelWithDebInfo" | "Debug"
#   CMAKE_C_FLAGS           = "-march=native"
#   CMAKE_CXX_FLAGS         = "-march=native"
#   CMAKE_EXE_LINKER_FLAGS  = "-fuse-ld=lld"
#   CMAKE_SHARED_LINKER_FLAGS = "-fuse-ld=lld"
#
#   # Meson  (delivered via temp makepkg.conf; only when 'meson' in consumes)
#   MESON_ARGS = "--buildtype=release --optimization=3"
#
#   # Env-injected  (passed directly to makepkg subprocess env, not the conf)
#   RUSTC_WRAPPER = "sccache"    # or "ccache"
#   CCACHE_DIR    = "/var/cache/ccache"
#   SCCACHE_DIR   = "/var/cache/sccache"
#   CARGO_HOME    = "/var/cache/cargo"
#   CARGO_NET_GIT_FETCH_WITH_CLI = "true"  # use git CLI; avoids SSH auth failures in build envs
#   PKG_CONFIG_PATH = "/usr/local/lib/pkgconfig"
#
#   # makepkg invocation flags
#   makepkg_flags = ["--noconfirm", "--syncdeps"]
#                 # common flags: --noconfirm --syncdeps --rmdeps --install
#                 #               --noprogressbar --log --cleanbuild --force
#
#   # SysForge behaviour keys  (not written to conf or env)
#   build_mode    = "source_built"      # "source_built" | "pgo_llvm_toolchain" | "kernel"
#                                     # omit for standard builds; legacy
#                                     # "patched_pkgbuild" still accepted on read
#   clean_builddir = true             # wipe src/ before build (default: false)
#   batch          = true             # abort on failure without prompting (default: false)
#   consumes       = ["makepkg", "rust", "cmake", "meson", "env"]
#                  # override auto-inferred consumes set; controls which key
#                  # types are delivered. omit to use inferred value from makedepends.
#   # CPU/IO throttling — per-profile override of [build] in sysforge.toml.
#   nice       = 19                   # scheduling niceness 0..19 (soft yield)
#   ionice     = "idle"               # IO class: "idle" | "best-effort"
#   cpu_quota  = "600%"               # hard CPU ceiling via systemd scope
#   jobs       = 6                    # parallel jobs; rewrites -j in MAKEFLAGS
#
# ── [profiles.NAME.append] ───────────────────────────────────────────────────
#
#   Token-level merge into the parent's value instead of full override.
#   Useful for adding individual flags without rewriting the whole string.
#   Conflict groups (from [append_conflict_groups] below) are resolved during merge.
#
#   [profiles.optimized_lto.append]
#   CFLAGS  = "-flto=thin"     # replaces -flto* in parent via conflict group
#   LDFLAGS = "--icf=all"      # appended (no matching prefix or conflict group)
#
# ── [[rules]] ────────────────────────────────────────────────────────────────
#
#   profile  = "optimized"     # (required) profile to apply when this rule matches
#   priority = 0               # (required) 0–99 (system); higher wins on conflict
#
#   # Match fields — all optional; omitting a field passes unconditionally
#   pkgnames      = ["htop", "htop-*"]   # ANY match; supports fnmatch globs
#   not_pkgnames  = ["llvm-*"]           # ALL absent; supports fnmatch globs
#   groups        = ["cosmic-*"]         # ALL match; supports fnmatch globs
#   not_groups    = ["multilib"]         # ALL absent; exact match
#   depends_any   = ["libfoo.so"]        # ANY present; exact match
#   depends_all   = ["glibc", "gcc-libs"] # ALL present; exact match
#   not_depends   = ["qt5-base"]         # ALL absent; exact match
#   makedepends_any = ["cargo"]          # ANY present; exact match
#   makedepends_all = ["cmake", "ninja"] # ALL present; exact match
#   not_makedepends = ["meson"]          # ALL absent; exact match
#
#   # Additive across all matched rules (not winner-takes-all like profile)
#   append_groups = ["pgo", "lto"]
#
# =============================================================================
# Defaults
# =============================================================================

[paths]
pkgbuild_src_dir = "~/src"

[defaults]
profile = "standard"
append_groups = ["sf-build"]
toolchain = "gcc"

# =============================================================================
# Profiles
# =============================================================================

[profiles.bare]
# Fallback profile, no flags
BUILDDIR = "$HOME/builds"

[profiles.standard]
extends = "bare"
CC       = "clang"
CXX      = "clang++"
AR       = "llvm-ar"
NM       = "llvm-nm"
RANLIB   = "llvm-ranlib"
STRIP    = "llvm-strip"
CFLAGS = "-march=native -O2 -pipe"
CXXFLAGS = "$CFLAGS"
LDFLAGS = "-Wl,-O1,--sort-common,--as-needed,-z,relro,-z,now"
makepkg_flags = ["--noconfirm", "--syncdeps"]
CARGO_NET_GIT_FETCH_WITH_CLI = "true"
RUSTC_WRAPPER                = "sccache"

[profiles.clean]
extends = "standard"
makepkg_flags = ["--noconfirm", "--syncdeps", "--cleanbuild"]

[profiles.optimized]
extends = "clean"
CFLAGS = "-march=native -O3 -pipe -fno-plt"
LDFLAGS = "-fuse-ld=lld -Wl,-O1,--sort-common,--as-needed,-z,relro,-z,now,--icf=all"

[profiles.pgo_llvm_toolchain]
extends = "optimized"
build_mode = "pgo_llvm_toolchain"

[profiles.patched]
extends = "optimized"
# Intentionally the legacy token: exercises normalize_build_mode's read-alias
# (patched_pkgbuild -> source_built) through the real config-load path (F12).
build_mode = "patched_pkgbuild"

[profiles.cosmic]
# COSMIC packages are Rust projects with C dependencies. Using CC=clang injects
# LLVM 22 bitcode into cargo's C dependency objects; rustc's bundled LLVM 21
# LTO plugin can't read them, causing link failures. GCC produces plain ELF
# objects with no LLVM bitcode, so the version mismatch doesn't occur.
extends = "patched"
CC  = "gcc"
CXX = "g++"

[profiles.kernel]
extends = "bare"
build_mode = "kernel"
batch = true
makepkg_flags = ["--noconfirm", "--syncdeps", "-f", "-c"]

[profiles.batch]
extends = "standard"
batch = true
makepkg_flags = ["--noconfirm", "--syncdeps", "--rmdeps", "--install", "--noprogressbar", "--log", "--cleanbuild"]
clean_builddir = true

[profiles.unattended]
extends = "batch"
# alias for batch

# =============================================================================
# Rules
# =============================================================================

[[rules]]
pkgnames = ["htop"]
profile = "optimized"
priority = 0

[[rules]]
groups = ["modified"]
profile = "patched"
priority = 10
append_groups = ["just-testing-stuff"]

[[rules]]
pkgnames = ["cosmic-*"]
profile = "cosmic"
priority = 10
append_groups = ["cosmic-patched"]

# Kernel routing ships commented out (matching etc/sysforge/profiles.toml) —
# kernel_build authority comes from the stage's owner_stage stamp (2.5.1-B9),
# not this rule. Tests that exercise RULE-routed kernel builds construct the
# rule explicitly; keeping it active here masked the shipped-default state.
# [[rules]]
# pkgnames = ["linux-custom"]
# profile = "kernel"
# priority = 20

[[rules]]
pkgnames = ["llvm", "clang", "lld"]
profile = "pgo_llvm_toolchain"
priority = 20
append_groups = ["pgo"]

[[rules]]
# lib32 packages build with the 32-bit GCC toolchain; clang injection and
# Clang-only flags (e.g. -flto=thin) break their builds.
pkgnames = ["lib32-*"]
profile = "bare"
priority = 30

[[rules]]
# wine and variants require GCC for 32-bit cross-compilation; CC=clang breaks configure.
pkgnames = ["wine", "wine-*"]
profile = "bare"
priority = 30

# =============================================================================
# Append conflict groups — mutually exclusive flag sets for token-level merges
#
# Groups here previously matched the inline CONFLICT_GROUPS constant in
# test_append_merge.py. Keep in sync if either is changed.
# =============================================================================

[append_conflict_groups]

# Position-independent code / executable flags — mutually exclusive
pic   = ["-fPIC", "-fPIE", "-fpic", "-fpie", "-fno-pic", "-fno-pie"]

# Link-time optimisation variants — mutually exclusive
lto   = ["-flto", "-flto=thin", "-flto=full", "-fno-lto"]

# Stack protection — mutually exclusive
stack = ["-fstack-protector", "-fstack-protector-strong", "-fno-stack-protector"]

# =============================================================================
# Consumes inference — makedepends → conf type routing
# =============================================================================

[consumes_inference]
cargo      = ["makepkg", "rust", "env"]
rust       = ["makepkg", "rust", "env"]
rustup     = ["makepkg", "rust", "env"]
lib32-rust = ["makepkg", "rust", "env"]
meson      = ["makepkg", "meson", "env"]
cmake      = ["makepkg", "cmake", "env"]
ninja      = ["makepkg", "env"]
make       = ["makepkg", "env"]
python     = ["makepkg", "env"]
git        = ["makepkg"]

# Auto-managed by sysforge — compiler/linker overrides recovered from build
# failures (sysforge build's interactive recovery menu, [c] swap). Keyed by
# pkgbase; applied last in resolve_profile, so a row here wins over the matched
# profile's CC/CXX/LD for that package. Safe to edit or delete by hand.
[package_compiler_overrides]
