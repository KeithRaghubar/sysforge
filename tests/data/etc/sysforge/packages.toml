# =============================================================================
# SysForge package manifest — starter stub
#
# Dual role (see DESIGN.md §Package Manifest):
#   - Pipeline `run packages` (bootstrap): every entry is installed.
#   - `sysforge update` / `sysforge build` (steady-state): entries are
#     build-rule overrides applied to the live install set.
#
# Fields per entry (all optional except name):
#   name           required  package name
#   source         optional  "repo" (pacman -S) | "aur" (AUR build) — set when
#                            classification is ambiguous or you want to force routing
#   enable_build_from_source optional  true = build this repo package from source
#                            instead of installing the binary via pacman
#   cache          optional  false = disable ccache/sccache (required for PGO)
#
# An entry with only `name` (or only `name` + `source`) has no override
# effect at steady-state — `source` is metadata only. `sysforge packages add`
# rejects such calls, and `sysforge update` warns once and treats the entry
# as inert.
#
# AUR packages are auto-cloned to [build] pkgbuild_src_dir on demand.
# =============================================================================

[build]
# Directory containing pre-cloned PKGBUILDs for aur/git packages.
# Each entry should have its own subdirectory: <pkgbuild_src_dir>/<name>/PKGBUILD
pkgbuild_src_dir = "~/src"
repo_mode = "build_from_source"  # "pacman" (default) | "build_from_source" — how repo packages are handled
#                       # "pacman"           → repo packages only enter `sysforge update`
#                       #                      scope if they carry a behavior-changing override.
#                       # "build_from_source"→ every installed repo package is tracked. Override-
#                       #                      tagged ones are source-built (pkgctl_checkout +
#                       #                      makepkg); the rest take a fast path via batched
#                       #                      `checkupdates` and one terminal `sudo pacman -Syu`
#                       #                      after the source builds. Requires pacman-contrib.
#                       # per-package enable_build_from_source = true overrides to source-build regardless
# review = true         # PKGBUILD review gate: diff prompt before building changed
#                       # sources (view/accept/skip/abort). false disables; --no-review
#                       # disables per run. Non-interactive runs auto-accept + warn.

# [group.<name>]        # named package set; expands into [[package]] entries at
# packages = ["a", "b"] # load time. Optional per-group defaults (source /
#                       # enable_build_from_source / cache) inherit to members; an explicit
#                       # [[package]] entry for the same name wins outright.


# =============================================================================
# Toolchain
# =============================================================================

[[package]]
name = "llvm"
source = "repo"
cache = false   # PGO build — never cache instrumented objects
[[package]]
name = "mesa-git"
source = "aur"
enable_build_from_source = true
[[package]]
name = "cosmic-comp-git"
source = "aur"
enable_build_from_source = true

