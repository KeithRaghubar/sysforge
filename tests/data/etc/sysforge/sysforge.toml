# =============================================================================
# sysforge.toml — global SysForge settings
#
# System default: /etc/sysforge/sysforge.toml
# Override individual values by creating this file or editing it in place.
# =============================================================================

[ui]
# Colorize output: "auto" | "always" | "never". The --color CLI flag overrides this.
color = "auto"
# editor = "vim"       # Override $EDITOR for sysforge reconfigure
# merge = "vimdiff"    # Diff/merge tool for `sysforge config merge` (.sfnew
#                      # adoption). Resolution: SYSFORGE_MERGE > this > $DIFFPROG
#                      # > vimdiff. Accepts args, e.g. "nvim -d" or "meld".

[log]
# Default stderr verbosity when no -v/--quiet flag is passed (0–3). Shipped
# default 0. CLI flags always win (--quiet=0, -v/-vv/-vvv=1/2/3). Invalid
# values clamped/ignored.
# verbosity = 0

[git]
# Timeout (s) for the per-source git fetch during `sysforge update` (full-history
# fetch+compare via the scheduler, never `git pull --rebase`). 0 = no timeout.
# Legacy key `pull_timeout` still honoured. See etc/sysforge/sysforge.toml.
fetch_timeout = 30

# Timeout in seconds for git clone / pkgctl repo clone operations.
# Set to 0 to disable the timeout (wait indefinitely).
clone_timeout = 60

[aur]
# Source-fetch throttling (politeness + rate-limit). Safe defaults; see
# etc/sysforge/sysforge.toml for full docs.
# min_fetch_interval_ms = 500  # min delay between source fetches (ms)
# rate_limit_abort_s = 120     # abort queue if 429/503 penalty exceeds this (s)

[build]
# Python interpreter for PKGBUILD build() steps; pinned ahead of any
# pyenv/asdf/conda shim on PATH. unset/"system" → /usr/bin/python (default);
# "3.12" → /usr/bin/python3.12; or an absolute path. See etc/sysforge/sysforge.toml.
# python = "system"
# repo_track = "stable"        # "stable" | "main" — which line source=repo
                               # checkouts follow. See etc/sysforge/sysforge.toml.
# Build CPU/IO throttling (global default; per-profile override in profiles.toml).
# See etc/sysforge/sysforge.toml for full docs.
# nice = 19          # scheduling niceness 0..19 (soft yield)
# ionice = "idle"    # IO class: "idle" | "best-effort"
# cpu_quota = "600%" # hard CPU ceiling via systemd-run scope (100% = one core)
# jobs = 6           # parallel jobs; rewrites -j in MAKEFLAGS

[failure_handling]
# Build-failure auto-repair (DESIGN.md §1242).
vendored_deps_missing = "auto_repair"
pgp_key_missing       = "auto_repair"
srcinfo_drift         = "auto_repair_with_warning"
checksum_mismatch     = "prompt_user"

[safety]
# LLVM source pre-flight. See etc/sysforge/sysforge.toml for full docs.
llvm_strict_toolchain = true
llvm_preflight        = true

[mesa]
# Opt-in hardware-filtering of mesa gallium/vulkan drivers (meson analogue of
# LLVM target filtering). OFF by default; software fallbacks always kept.
# See etc/sysforge/sysforge.toml for full docs.
# filter_drivers = false
# gallium = ["radeonsi"]
# vulkan  = ["amd"]

[pgo]
# Packages for which `--pgo` is recommended (suppresses the "not recommended"
# warning). mesa is always allowed. See etc/sysforge/sysforge.toml for full docs.
allow = ["mesa"]

[update]
# Standing defaults for `sysforge update` drift auto-rebuild. The matching
# CLI flags (--rebuild-on-drift / --rebuild-on-toolchain-drift /
# --rebuild-on-flag-drift) still win when passed.
rebuild_on_drift = false            # umbrella: opts into both axes below
rebuild_on_toolchain_drift = false  # rebuild on toolchain-variant drift only
rebuild_on_flag_drift = false       # rebuild on resolved-flag drift only
