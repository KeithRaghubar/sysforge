# =============================================================================
# toolchain.toml — custom LLVM or GCC toolchain build (stage 6 / sysforge run toolchain)
#
# Opt-in stage. See DESIGN.md §Toolchain stage for details.
# The built compiler is automatically propagated to subsequent stages via
# pipeline state: packages and kernel will use CC/CXX from this result.
# =============================================================================

enabled    = true
compiler   = "llvm"    # "llvm" or "gcc"
pgo        = true      # LLVM only: enable 4-pass PGO bootstrap (ignored for gcc)
skip_build = false

# Path where pass-2 binaries are extracted for use as CC/CXX in pass 3.
# Must be on the same filesystem as /usr and have ~2 GB free.
# pgo_staging = "/var/tmp/sysforge-llvm-stage2"

# Path where profraw files are written during pass 2 and merged to profdata.
# Profraw files are deleted after merging; profdata is preserved for reuse.
# On subsequent runs, compatible profdata (same LLVM major) skips passes 1a-2.
# Use --rebuild-profdata to force a full 4-pass build.
# Needs ~500 MB free during pass 2.
# pgo_store = "/var/tmp/sysforge-llvm-pgo"

# Build-safety Gate 1 (LLVM path only — the GCC path is register-only and skips
# all gates). The two keys below are *settable config keys shown at their
# defaults* — leave them commented to keep the default, or uncomment to override.
# min_build_free_gb = 40   # default 40. Min free GiB per build filesystem
#                          # (one-off override: --skip-build-space-check).
# require_multilib  = true # default true. Require [multilib] when any lib32-*
#                          # is in scope (no CLI equivalent — config only).
# rebuild_soname_consumers = "prompt"  # default "prompt". prompt|auto|off for
#                          # rebuilding installed libLLVM consumers (mesa, …)
#                          # when an LLVM version bump changes the soname.
#                          # CLI override: --rebuild-soname-consumers.

# ---------------------------------------------------------------------------
# Package lists — override built-in defaults if needed
#
# [packages]
# pgo     = ["llvm", "llvm-libs", "clang", "lld"]
# non_pgo = ["polly", "compiler-rt", "openmp", "spirv-llvm-translator"]
# lib32   = ["lib32-llvm", "lib32-llvm-libs", "lib32-clang", "lib32-spirv-llvm-translator"]
#
# For GCC, only non_pgo is used:
# non_pgo = ["gcc", "gcc-libs"]
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# LLVM_TARGETS_TO_BUILD filtering — see etc/sysforge/toolchain.toml for docs.
# Test fixture leaves this unset so callers exercise the autodetect fallback.
# Override here only when a test specifically needs the explicit-config path.
#
# [llvm]
# targets = ["X86", "AMDGPU", "NVPTX"]
# ---------------------------------------------------------------------------
